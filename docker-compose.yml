services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - trado_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default

  app:
    image: node:22
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NODE_ENV: production
    volumes:
      - ./:/app
    ports:
      - "${APP_HOST_PORT}:3000"
    command: >
      sh -c "npm install &&
             npm run build &&
             node .output/server/index.mjs"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - main

volumes:
  trado_pg_data:

networks:
  main:
    external: true
